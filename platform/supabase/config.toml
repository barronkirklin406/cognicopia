# Supabase CLI configuration for local development: `supabase start`, `supabase db reset`.
#
# Written by hand and kept to the essentials, so the CLI's defaults supply the rest. If your
# CLI version objects to a key, run `supabase init` in a scratch folder, copy its config.toml
# here, and keep the three settings that matter: the project_id, the seed path, and
# email confirmation on (the create_facility() function requires a confirmed address).

project_id = "cognicopia-platform"

[api]
enabled = true
port = 54321
# The Data API exposes only "public". The "private" schema (internal functions) is not listed
# on purpose: that keeps those functions out of reach of the API.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
# Where the platform runs locally (APP_URL in .env.local). Confirmation and reset emails link back here.
site_url = "http://127.0.0.1:3000"
# Only the page that finishes a sign-in link (app/auth/callback) may be a link's destination, not the
# whole site. In the hosted project, set the Site URL to your APP_URL and the redirect URL to your
# APP_URL plus /auth/callback (Authentication > URL Configuration).
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
enable_signup = true
# The sign-up and reset forms ask for 12 (lib/domain/auth.ts). Set it here as well, and in the hosted
# project (Authentication > Providers > Email), because anyone can call Supabase's sign-up address
# directly without using our forms.
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
